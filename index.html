<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <script>
    // iPhone/iPad Safari (not the Home Screen app): Safari's toolbar floats over the bottom of the page,
    // so the game keeps its buttons above it (see --sab in css/base.css)
    if (/iP(hone|od|ad)/.test(navigator.userAgent) && !navigator.standalone && !(window.matchMedia && matchMedia('(display-mode: standalone)').matches))
      document.documentElement.classList.add('ios-browser');
    // Home Screen app on iOS: the page draws under the clock but the screen is reported one status bar
    // shorter, which leaves an empty strip at the bottom. Measure it and stretch the game over it.
    (function () {
      const standalone = navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
      if (!standalone) return;
      document.documentElement.classList.add('ios-standalone');
      const fit = () => {
        const tall = window.innerHeight > window.innerWidth, sh = tall ? Math.max(screen.height, screen.width) : Math.min(screen.height, screen.width);
        const gap = Math.round(sh - window.innerHeight);
        document.documentElement.style.setProperty('--gapfix', (gap > 0 && gap < 140 ? gap : 0) + 'px');
      };
      fit();
      window.addEventListener('resize', fit);
      window.addEventListener('orientationchange', () => setTimeout(fit, 300));
    })();
  </script>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pocket Pals">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/icon-32.png">
  <link rel="icon" type="image/svg+xml" href="assets/icons/icon.svg">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="dns-prefetch" href="https://veekun.com">
  <link rel="dns-prefetch" href="https://play.pokemonshowdown.com">
  <script>
    // keep pictures and game files on the device so the game opens quickly next time (see sw.js)
    if ('serviceWorker' in navigator && location.protocol === 'https:') addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  </script>
  <title>Pocket Pals</title>
  <link rel="stylesheet" href="css/base.css?v=49">
  <link rel="stylesheet" href="css/game.css?v=49">
  <link rel="stylesheet" href="css/battle.css?v=49">
</head>
<body>
  <div class="app" id="app">
    <div class="scene" id="scene" aria-hidden="true"></div>
    <header class="top">
      <button class="profile" data-do="sheet" data-kind="settings" aria-label="Profile and settings">
        <span class="avatar"><span class="avatar-empty"></span></span>
        <span class="profile-info">
          <span class="p-name" id="pName">Trainer</span>
          <span class="p-meta"><span class="p-lv">Lv <b id="pLevel">1</b></span><span class="p-exp tnum" id="pExpText">EXP 0%</span></span>
          <span class="bar"><i id="pExpBar"></i></span>
        </span>
      </button>
      <div class="wallet">
        <button class="pill" data-do="sheet" data-kind="explore" id="coinPill"><span class="pill-ic coin"></span><span class="tnum" id="coins">0</span><span class="pill-plus"></span></button>
        <button class="pill" data-do="sheet" data-kind="quests" id="gemPill"><span class="pill-ic gem"></span><span class="tnum" id="gems">0</span><span class="pill-plus"></span></button>
      </div>
      <button class="icon-btn" data-do="sheet" data-kind="settings" aria-label="Settings" id="settingsBtn"></button>
    </header>

    <section class="needs" id="needs" aria-label="Needs"></section>
    <div class="banner" id="banner" hidden></div>

    <main class="stage">
      <div class="actions" id="actions"></div>
      <button class="card loc-card" id="locCard" data-do="sheet" data-kind="explore"></button>
      <canvas class="pet-canvas" id="petCanvas" aria-label="Your Pokémon"></canvas>
      <div class="react" id="react" hidden aria-hidden="true"><img id="reactImg" alt=""></div>
      <div class="pal-slot" id="palSlot" aria-hidden="true">
        <div class="pal-ring" id="palRing"></div>
        <div class="pal-shadow"></div>
        <p class="pal-caption">Your Pokémon will live here</p>
      </div>
      <div class="card quest-card" id="questCard"></div>
    </main>

    <nav class="tabbar" id="tabbar"></nav>

    <div class="sheet-wrap" id="sheet" hidden>
      <div class="scrim" data-do="close"></div>
      <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
        <header class="sheet-head">
          <h2 id="sheetTitle"></h2>
          <button class="icon-btn sm" data-do="close" aria-label="Close" id="sheetClose"></button>
        </header>
        <div class="sheet-body" id="sheetBody"></div>
      </section>
    </div>
    <div class="toasts" id="toasts" aria-live="polite"></div>
    <div class="walk-layer" id="walkLayer" hidden></div>
    <div class="battle-layer" id="battleLayer" hidden></div>

    <!-- the Professor's welcome and the guided tour -->
    <div class="story" id="story" hidden>
      <div class="story-dim"></div>
      <div class="spot" id="spot" hidden></div>
      <img class="story-figure" id="storyFigure" alt="" hidden>
      <div class="dialog" role="dialog" aria-live="polite" aria-labelledby="dlgWho">
        <div class="dlg-face" id="dlgFace"></div>
        <div class="dlg-body">
          <div class="dlg-who" id="dlgWho"></div>
          <p class="dlg-text" id="dlgText"></p>
          <div id="dlgExtra"></div>
          <div class="dlg-foot">
            <button class="dlg-skip" id="dlgSkip" data-do="skip-tour" hidden>Skip tutorial</button>
            <span class="dlg-next" id="dlgNext">Tap to continue ▸</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/icons.js?v=49"></script>
  <script src="js/update.js?v=49"></script>
  <script src="js/catalog-items.js?v=49"></script>
  <script src="js/catalog-pokemon.js?v=49"></script>
  <script src="js/content-lumera.js?v=49"></script>
  <script src="js/schema.js?v=49"></script>
  <script src="js/store.js?v=49"></script>
  <script src="js/sprite.js?v=49"></script>
  <script src="js/online/firebase-config.js?v=49"></script>
  <script src="js/online/cloud.js?v=49"></script>
  <script src="js/online/social.js?v=49"></script>
  <script src="js/engine/progression.js?v=49"></script>
  <script src="js/engine/encounters.js?v=49"></script>
  <script src="js/audio.js?v=49"></script>
  <script src="js/battle.js?v=49"></script>
  <script src="js/engine/story.js?v=49"></script>
  <script src="js/game.js?v=49"></script>
</body>
</html>
