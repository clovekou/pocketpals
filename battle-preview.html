<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Battle Preview</title>
  <link rel="stylesheet" href="css/base.css?v=31">
  <link rel="stylesheet" href="css/battle.css?v=31">
</head>
<body class="preview">
  <!-- A sandbox for the real battle engine (js/battle.js) with a sample team. It never touches your save. -->
  <div class="pv-frame">
    <div class="preview-bar">
      <span class="pv-title">Battle preview</span>
      <button class="pv-btn" data-pv="wild">Wild</button>
      <button class="pv-btn" data-pv="trainer">Trainer</button>
    </div>
    <div class="pv-root" id="root"></div>
  </div>

  <script src="js/icons.js?v=31"></script>
  <script src="js/catalog-items.js?v=31"></script>
  <script src="js/catalog-pokemon.js?v=31"></script>
  <script src="js/content-lumera.js?v=31"></script>
  <script src="js/schema.js?v=31"></script>
  <script src="js/store.js?v=31"></script>
  <script src="js/sprite.js?v=31"></script>
  <script src="js/audio.js?v=31"></script>
  <script src="js/battle.js?v=31"></script>
  <script>
    (function () {
      const data = PP.store.normalizeData(null);            // the default game data, not your saved data
      if (PP.Audio) PP.Audio.configure(data);               // cries and sound effects use the default settings
      const S = PP.store, sp = id => data.pokemon.find(p => p.id === id);
      const mk = (id, level) => ({ uid: id, species: id, level, exp: S.expForLevel(sp(id).growth, level), hp: null, nickname: '' });
      const wildPool = data.encounters.filter(e => e.table === 'fernway-walk' || e.table === 'mossglow-walk');
      const bg = id => (data.backgrounds.find(b => b.id === id) || {}).image;
      function start(kind) {
        document.querySelectorAll('.pv-btn').forEach(b => b.classList.toggle('on', b.dataset.pv === kind));
        const team = [mk('charmander', 7), mk('pikachu', 6), mk('squirtle', 5)];
        const bag = { 'poke-ball': 5, 'great-ball': 2, 'ultra-ball': 1, potion: 3, 'super-potion': 1 };
        let foes, trainer = null;
        if (kind === 'wild') { const e = wildPool[Math.floor(Math.random() * wildPool.length)]; foes = [{ species: e.species, level: e.minLevel + Math.floor(Math.random() * (e.maxLevel - e.minLevel + 1)) }]; }
        else { foes = [{ species: 'rattata', level: 5 }, { species: 'pidgey', level: 6 }]; trainer = { name: 'Camper Mira', prize: 240 }; }
        PP.Battle.start({
          root: document.getElementById('root'), data, kind, foes, trainer, team, bag,
          backgrounds: [kind === 'trainer' ? bg('battle-gym') : bg('battle-forest'), bg('sakura-meadow')],
          onEnd: () => start(kind),
        });
      }
      document.addEventListener('click', e => { const b = e.target.closest('[data-pv]'); if (b) start(b.dataset.pv); });
      start(new URLSearchParams(location.search).get('mode') === 'trainer' ? 'trainer' : 'wild');
    })();
  </script>
</body>
</html>
